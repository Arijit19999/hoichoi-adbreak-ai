[project]
name = "backend"
version = "0.1.0"
description = "hoichoi AdBreak AI - context-aware scene segmentation and ad placement"
readme = "README.md"
authors = [
    { name = "Arijit19999", email = "ju.it.arijit2021@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "gdown>=6.4.0",
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scenedetect>=0.7.1",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
